image:
  repository: ghcr.io/jaiakash/kai-mcp-server
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# Policy is the security boundary you actually configure. The RBAC the chart
# grants is derived from it: with allowWrites=false the ServiceAccount is
# granted read verbs only, so a bug in the server cannot write even if it tries.
policy:
  allowWrites: false
  dryRunOnly: false
  protectedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  allowedNamespaces: []
  deniedNamespaces: []
  maxLogLines: 500
  enforceRBAC: true

server:
  transport: http
  addr: ":8080"
  # Set true when running more than one replica behind a load balancer that
  # does not do session affinity.
  stateless: false
  logLevel: info

rbac:
  # create=false lets you bind an existing Role you control instead.
  create: true
  # scope: cluster grants a ClusterRole; namespaced grants a Role in each
  # entry of policy.allowedNamespaces, which must then be non-empty.
  scope: cluster

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Defaults satisfy the restricted Pod Security Standard.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

extraEnv: []
