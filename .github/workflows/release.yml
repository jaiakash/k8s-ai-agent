name: Release

# The Helm chart and server.json both point at ghcr.io/jaiakash/kai-mcp-server.
# Until this workflow runs, that reference is a promise the repo cannot keep:
# `helm install` gets an ImagePullBackOff. Tagging is what makes it true.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v0.2.0'
        required: true

permissions:
  contents: write     # create the GitHub release
  packages: write     # push to ghcr.io
  id-token: write     # cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/kai-mcp-server

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      # A published image whose tag disagrees with the chart and the registry
      # metadata is worse than no image: every install path then points
      # somewhere different.
      - name: Tag matches chart and server.json
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          chart=$(grep '^appVersion:' deploy/helm/kai/Chart.yaml | cut -d'"' -f2)
          sj=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          echo "tag=$version chart=$chart server.json=$sj"
          if [ "$version" != "$chart" ] || [ "$version" != "$sj" ]; then
            echo "::error::tag $version does not match chart appVersion $chart / server.json $sj"
            exit 1
          fi

  image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest

      # arm64 included because a good share of people run local clusters on
      # Apple silicon, and the binary is CGO-free so it costs nothing to add.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.inputs.tag || github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${TAG#v}\` (linux/amd64, linux/arm64, cosign-signed).

          \`\`\`bash
          go install github.com/jaiakash/k8s-ai-agent/cmd/kai-mcp-server@$TAG
          \`\`\`"
